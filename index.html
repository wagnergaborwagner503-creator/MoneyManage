<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MoneyManage – Havi pénzügyek okosan</title>
  <meta name="description" content="MoneyManage (MM) – Tervezd meg a havi költségvetésed, kövesd a kiadásaid, érd el a céljaid.">
  <meta name="theme-color" content="#2563eb" id="meta-theme">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MM">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Téma alkalmazása még az első festés előtt (nincs villanás)
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem("mm_settings") || "{}");
        var mode = s.theme || "system";
        var dark = mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) { document.documentElement.dataset.theme = "light"; }
    })();
  </script>
</head>
<body>

  <!-- ============ AUTH SCREEN ============ -->
  <div id="auth-screen" class="auth-screen hidden">
    <div class="auth-bg"></div>
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-badge"><i data-lucide="wallet"></i></div>
        <h1>MoneyManage</h1>
        <p class="auth-tagline">Tervezd meg a hónapod. Ne érjen meglepetés.</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" data-authtab="login">Bejelentkezés</button>
        <button class="auth-tab" data-authtab="register">Regisztráció</button>
      </div>

      <form id="auth-form" class="auth-form">
        <div class="field" id="auth-name-field" style="display:none">
          <label for="auth-name">Név</label>
          <div class="input-wrap"><i data-lucide="user"></i><input type="text" id="auth-name" placeholder="Pl. Kiss Anna" autocomplete="name"></div>
        </div>
        <div class="field">
          <label for="auth-email">E-mail</label>
          <div class="input-wrap"><i data-lucide="mail"></i><input type="email" id="auth-email" placeholder="te@email.hu" autocomplete="email" required></div>
        </div>
        <div class="field">
          <label for="auth-password">Jelszó</label>
          <div class="input-wrap"><i data-lucide="lock"></i><input type="password" id="auth-password" placeholder="••••••••" autocomplete="current-password" required minlength="6"><button type="button" class="pw-toggle" id="auth-pw-toggle" aria-label="Jelszó megjelenítése"><i data-lucide="eye"></i></button></div>
        </div>
        <div class="field" id="auth-currency-field" style="display:none">
          <label for="auth-currency">Fő pénznem</label>
          <div class="input-wrap"><i data-lucide="circle-dollar-sign"></i><select id="auth-currency"></select></div>
          <p class="field-hint">Ebben tároljuk és tervezzük a pénzügyeid. Később bármikor átválthatsz másik megjelenítésre.</p>
        </div>
        <div id="auth-error" class="auth-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-block" id="auth-submit">Bejelentkezés</button>
        <button type="button" class="btn-link" id="auth-forgot">Elfelejtett jelszó?</button>
      </form>

      <div class="auth-divider"><span>vagy</span></div>
      <button class="btn btn-ghost btn-block" id="btn-local-mode"><i data-lucide="smartphone"></i> Kipróbálás fiók nélkül</button>
      <p class="auth-note" id="auth-config-note" style="display:none">A Supabase nincs beállítva (js/config.js), ezért csak a helyi mód érhető el. Lásd: README.md</p>
    </div>
  </div>

  <!-- ============ APP ============ -->
  <div id="app" class="app hidden">

    <!-- Sidebar (desktop) -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-badge"><i data-lucide="wallet"></i></div>
        <span>MoneyManage</span>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" data-view="dashboard"><i data-lucide="layout-dashboard"></i> Áttekintés</button>
        <button class="nav-item" data-view="transactions"><i data-lucide="receipt-text"></i> Tranzakciók</button>
        <button class="nav-item" data-view="budget"><i data-lucide="wallet"></i> Költségvetés</button>
        <button class="nav-item" data-view="goals"><i data-lucide="target"></i> Célok</button>
        <button class="nav-item" data-view="stats"><i data-lucide="chart-column"></i> Statisztikák</button>
        <button class="nav-item" data-view="profile"><i data-lucide="user"></i> Profil</button>
      </nav>
      <div class="sidebar-footer">
        <span id="sidebar-user" class="sidebar-user"></span>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main">
      <header class="appbar">
        <div class="appbar-brand">
          <div class="logo-badge sm"><i data-lucide="wallet"></i></div>
          <span class="appbar-name">MoneyManage</span>
        </div>
        <div class="appbar-right">
          <button class="appbar-profile" id="appbar-profile" aria-label="Profil">
            <span class="appbar-pname" id="appbar-pname"></span>
            <span class="appbar-avatar" id="appbar-avatar">?</span>
          </button>
          <button class="icon-btn-round" id="btn-hide" aria-label="Összegek elrejtése"><i data-lucide="eye"></i></button>
          <button class="icon-btn-round" id="btn-settings" aria-label="Beállítások"><i data-lucide="settings"></i></button>
        </div>
      </header>
      <div class="monthbar">
        <div class="month-nav">
          <button class="icon-btn-round" id="month-prev" aria-label="Előző hónap"><i data-lucide="chevron-left"></i></button>
          <button class="month-label" id="month-label">2026. június</button>
          <button class="icon-btn-round" id="month-next" aria-label="Következő hónap"><i data-lucide="chevron-right"></i></button>
        </div>
        <button class="btn btn-primary btn-sm topbar-add" id="btn-quick-add"><i data-lucide="plus"></i> Új tétel</button>
      </div>

      <div id="view-container" class="view-container">
        <section id="view-dashboard" class="view"></section>
        <section id="view-transactions" class="view hidden"></section>
        <section id="view-budget" class="view hidden"></section>
        <section id="view-goals" class="view hidden"></section>
        <section id="view-stats" class="view hidden"></section>
        <section id="view-profile" class="view hidden"></section>
      </div>
    </main>

    <!-- Bottom nav (mobile) -->
    <nav class="bottom-nav">
      <button class="bnav-item active" data-view="dashboard"><i data-lucide="layout-dashboard"></i><span>Áttekintés</span></button>
      <button class="bnav-item" data-view="transactions"><i data-lucide="receipt-text"></i><span>Tételek</span></button>
      <button class="bnav-fab" id="btn-fab" aria-label="Új tétel"><i data-lucide="plus"></i></button>
      <button class="bnav-item" data-view="stats"><i data-lucide="chart-column"></i><span>Statisztika</span></button>
      <button class="bnav-item" data-view="profile"><i data-lucide="user"></i><span>Profil</span></button>
    </nav>
  </div>

  <!-- ============ MODAL ============ -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modal-title">Új tétel</h3>
        <button class="modal-close" id="modal-close" aria-label="Bezárás"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
