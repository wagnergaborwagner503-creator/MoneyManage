<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MoneyManage – Havi pénzügyek okosan</title>
  <meta name="description" content="MoneyManage (MM) – Tervezd meg a havi költségvetésed, kövesd a kiadásaid, érd el a céljaid.">
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MM">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============ AUTH SCREEN ============ -->
  <div id="auth-screen" class="auth-screen hidden">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-badge">MM</div>
        <h1>MoneyManage</h1>
        <p class="auth-tagline">Tervezd meg a hónapod. Ne érjen meglepetés.</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" data-authtab="login">Bejelentkezés</button>
        <button class="auth-tab" data-authtab="register">Regisztráció</button>
      </div>

      <form id="auth-form" class="auth-form">
        <div class="field" id="auth-name-field" style="display:none">
          <label for="auth-name">Név</label>
          <input type="text" id="auth-name" placeholder="Pl. Kiss Anna" autocomplete="name">
        </div>
        <div class="field">
          <label for="auth-email">E-mail</label>
          <input type="email" id="auth-email" placeholder="te@email.hu" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="auth-password">Jelszó</label>
          <input type="password" id="auth-password" placeholder="••••••••" autocomplete="current-password" required minlength="6">
        </div>
        <div id="auth-error" class="auth-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-block" id="auth-submit">Bejelentkezés</button>
        <button type="button" class="btn-link" id="auth-forgot">Elfelejtett jelszó?</button>
      </form>

      <div class="auth-divider"><span>vagy</span></div>
      <button class="btn btn-ghost btn-block" id="btn-local-mode">📱 Kipróbálás fiók nélkül (helyi mód)</button>
      <p class="auth-note" id="auth-config-note" style="display:none">⚠️ A Supabase nincs beállítva (js/config.js), ezért csak a helyi mód érhető el. Lásd: README.md</p>
    </div>
  </div>

  <!-- ============ APP ============ -->
  <div id="app" class="app hidden">

    <!-- Sidebar (desktop) -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-badge">MM</div>
        <span>MoneyManage</span>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" data-view="dashboard"><span class="nav-ico">🏠</span> Áttekintés</button>
        <button class="nav-item" data-view="transactions"><span class="nav-ico">🧾</span> Tranzakciók</button>
        <button class="nav-item" data-view="budget"><span class="nav-ico">📋</span> Költségvetés</button>
        <button class="nav-item" data-view="goals"><span class="nav-ico">🎯</span> Célok</button>
        <button class="nav-item" data-view="stats"><span class="nav-ico">📊</span> Statisztikák</button>
        <button class="nav-item" data-view="profile"><span class="nav-ico">👤</span> Profil</button>
      </nav>
      <div class="sidebar-footer">
        <span id="sidebar-user" class="sidebar-user"></span>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main">
      <!-- Top bar with month selector -->
      <header class="topbar">
        <div class="month-nav">
          <button class="month-btn" id="month-prev" aria-label="Előző hónap">‹</button>
          <button class="month-label" id="month-label">2026. június</button>
          <button class="month-btn" id="month-next" aria-label="Következő hónap">›</button>
        </div>
        <div class="topbar-actions">
          <button class="icon-round mobile-only" data-view="budget" title="Költségvetés">📋</button>
          <button class="icon-round mobile-only" data-view="profile" title="Profil">👤</button>
          <button class="btn btn-primary btn-sm" id="btn-quick-add">+ Új tétel</button>
        </div>
      </header>

      <div id="view-container" class="view-container">
        <!-- Views are rendered by JS -->
        <section id="view-dashboard" class="view"></section>
        <section id="view-transactions" class="view hidden"></section>
        <section id="view-budget" class="view hidden"></section>
        <section id="view-goals" class="view hidden"></section>
        <section id="view-stats" class="view hidden"></section>
        <section id="view-profile" class="view hidden"></section>
      </div>
    </main>

    <!-- Bottom nav (mobile) -->
    <nav class="bottom-nav">
      <button class="bnav-item active" data-view="dashboard"><span>🏠</span>Áttekintés</button>
      <button class="bnav-item" data-view="transactions"><span>🧾</span>Tételek</button>
      <button class="bnav-fab" id="btn-fab" aria-label="Új tétel">+</button>
      <button class="bnav-item" data-view="goals"><span>🎯</span>Célok</button>
      <button class="bnav-item" data-view="stats"><span>📊</span>Statisztika</button>
    </nav>

    <!-- More menu for mobile (budget + profile) -->
  </div>

  <!-- ============ MODAL ============ -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modal-title">Új tétel</h3>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
